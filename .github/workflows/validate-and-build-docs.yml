name: Validate and Build Ontology Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.ttl'
      - '**.owl'
      - '**.rdf'
      - 'VERSION'
      - '.github/workflows/validate-and-build-docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.ttl'
      - '**.owl'
      - '**.rdf'
      - 'VERSION'
      - 'scripts/**'
      - '.github/workflows/validate-and-build-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The "Check if VERSION was manually changed" step below diffs against
          # HEAD~1. actions/checkout defaults to fetch-depth: 1, so HEAD~1 does
          # not exist, git diff fails, the grep matches nothing and the check
          # reports "not changed" whatever the commit did. Every hand-set
          # version was therefore patch-bumped past: 0.2.0 was set deliberately
          # for the UCO 1.5.0 metaclass change and shipped as 0.2.1.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rdflib ontospy

      - name: Validate ontology and SHACL shapes
        run: python scripts/validate_ontology.py

      - name: Validate examples against ontology
        run: python scripts/validate_examples.py

      - name: Check if VERSION was manually changed
        id: version-check
        if: github.event_name == 'push'
        run: |
          if git diff HEAD~1 --name-only | grep -q '^VERSION$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and sync to TTL files
        if: (github.event_name == 'push' && steps.version-check.outputs.changed != 'true') || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_version.py --bump-patch

      - name: Sync version to TTL files
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && steps.version-check.outputs.changed == 'true')
        run: python scripts/sync_version.py

      - name: Build documentation
        run: |
          # Preserve docs/data (contains KB files from separate workflow)
          if [ -d docs/data ]; then
            mv docs/data /tmp/docs-data-backup
          fi

          # Create a clean docs directory
          rm -rf docs
          mkdir -p docs

          # Generate documentation from the ontology TTL files only.
          #
          # ontospy recurses, so pointing it at the repository root also swept
          # up solve_it_examples/. Since the UCO 1.5.0 metaclass change the
          # examples declare techniques as classes ("a owl:Class ,
          # solveit-core:Technique"), so ontospy rendered a class page for each
          # one and listed it in the class index. The result was ten arbitrary
          # solveit-data:techniqueDFT-* entries — whichever techniques the
          # examples happened to use — presented as part of the ontology's own
          # vocabulary. Technique entries are knowledge base data and belong to
          # data.solveit-df.org; the ontology defines solveit-core:Technique.
          #
          # Staging the root-level solve_it_*.ttl files keeps the examples out.
          # The examples are still documented, by generate_examples_page.py.
          #
          # Keep this in step with scripts/build_docs_local.sh, which mirrors
          # this build.
          #
          # Note: --individuals flag causes template errors in ontospy 2.1.1
          ONTOLOGY_SRC="$(mktemp -d)"
          cp solve_it_*.ttl "$ONTOLOGY_SRC"/
          ontospy gendocs "$ONTOLOGY_SRC" -o docs --type 2
          rm -rf "$ONTOLOGY_SRC"

          # Restore docs/data AFTER ontospy (which may clean the output dir)
          if [ -d /tmp/docs-data-backup ]; then
            mv /tmp/docs-data-backup docs/data
          fi

          # Create CNAME file for GitHub Pages custom domain
          echo "ontology.solveit-df.org" > docs/CNAME

      - name: Set docs title
        run: |
          # Replace ontospy's generic title with versioned SOLVE-IT title
          python scripts/set_docs_title.py docs

      - name: Add GitHub link to docs
        run: python scripts/add_github_link.py docs

      - name: Fix external ontology links
        run: |
          # Rewrite links to UCO/CASE classes to point to official documentation
          # Auto-discovers class names from TTL sources; fails if any are unknown
          python scripts/fix_external_links.py docs .

      - name: Validate external links
        run: |
          # Check that all external UCO/CASE links use correct CamelCase
          python scripts/validate_external_links.py docs

      - name: Generate IRI redirects
        run: |
          # Generate redirect folders for all classes and properties
          python scripts/generate_iri_redirects.py

      - name: Generate examples page
        run: |
          # Generate HTML page documenting example instances
          python scripts/generate_examples_page.py

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit documentation changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git add docs/ solve_it_*.ttl VERSION
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ontology documentation" -m "Generated from ontology files using Ontospy" -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
