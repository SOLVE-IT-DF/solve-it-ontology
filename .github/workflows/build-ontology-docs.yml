name: Build Ontology Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.ttl'
      - '**.owl'
      - '**.rdf'
      - '.github/workflows/build-ontology-docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.ttl'
      - '**.owl'
      - '**.rdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for any in-progress Pages deployment to complete
        run: |
          echo "Waiting for any in-progress Pages deployments to complete..."
          # Wait up to 5 minutes for Pages deployment
          for i in {1..30}; do
            # Check if there's an in-progress pages-build-deployment
            STATUS=$(gh api repos/${{ github.repository }}/actions/runs \
              --jq '.workflow_runs[] | select(.name == "pages-build-deployment" and .status == "in_progress") | .status' \
              2>/dev/null | head -1)

            if [ -z "$STATUS" ]; then
              echo "No in-progress Pages deployment found. Proceeding..."
              break
            fi

            echo "Pages deployment still in progress (check $i/30). Waiting 10 seconds..."
            sleep 10
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ontospy
        run: |
          python -m pip install --upgrade pip
          pip install ontospy

      - name: Build documentation
        run: |
          # Preserve CNAME file if it exists
          if [ -f docs/CNAME ]; then
            cp docs/CNAME CNAME.backup
          fi

          # Create a clean docs directory
          rm -rf docs
          mkdir -p docs

          # Generate documentation from all TTL files
          ontospy gendocs . -o docs --type 2

          # Restore CNAME file after ontospy (which overwrites the docs directory)
          if [ -f CNAME.backup ]; then
            mv CNAME.backup docs/CNAME
          fi

      - name: Generate IRI redirects
        run: |
          # Generate redirect folders for all classes and properties
          python scripts/generate_iri_redirects.py

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit documentation changes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ontology documentation" -m "Generated from ontology files using Ontospy" -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
