name: Validate against CASE 1.5.0

# Validates the generated knowledge base against the SHACL shapes of CASE, UCO
# and SOLVE-IT together. The three are merged into one graph and passed to
# case_validate as --ontology-graph, so a violation of a SOLVE-IT shape fails
# this job exactly as a CASE one does.
#
# The CASE/UCO version is pinned deliberately. When that pin moves, update BOTH
# the `case_version` default below AND the workflow name above, so the name in
# the Actions list never lies about what is being validated.
#
# On what triggers it: the graph only changes when the ontology changes or the
# knowledge base is rebuilt, so it is checked on those events and not on a
# timer.
#
# The knowledge base is rebuilt hourly by generate-knowledge-base.yml, which
# commits with GITHUB_TOKEN. Pushes made with that token do not trigger further
# workflow runs, so the `push` trigger below never fires for a regenerated
# knowledge base — it only catches hand edits. That job therefore calls this one
# directly (workflow_call), and only on the runs where it actually committed a
# change. Most hourly runs regenerate an identical file and call nothing.

on:
  workflow_dispatch:
    inputs:
      case_version:
        description: 'CASE release tag to validate against (UCO comes from its submodule)'
        default: '1.5.0'
        required: true
        type: string
  workflow_call:
    inputs:
      case_version:
        description: 'CASE release tag to validate against'
        default: '1.5.0'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '**.ttl'
      - 'docs/data/**'
      - '.github/workflows/validate-against-case-1.5.0.yml'

concurrency:
  group: case-validation
  cancel-in-progress: true

env:
  # inputs.case_version is unset on push, so it needs a default here as well
  # as on the dispatch and call inputs.
  CASE_VERSION: ${{ inputs.case_version || '1.5.0' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontology repository
        uses: actions/checkout@v4

      # The merged graph is expensive to build: it needs CASE checked out with
      # the UCO submodule, then ~32 files parsed and reserialised. It changes
      # only when the CASE pin moves or a local ontology file changes, so key
      # the cache on exactly those two things.
      - name: Restore merged ontology graph
        id: graph-cache
        uses: actions/cache@v4
        with:
          path: combined_ontology.ttl
          key: merged-ontology-${{ env.CASE_VERSION }}-${{ hashFiles('solve_it_*.ttl') }}

      - name: Checkout CASE (with the UCO submodule)
        if: steps.graph-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: casework/CASE
          ref: ${{ env.CASE_VERSION }}
          submodules: recursive
          path: case-src

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # case-utils 0.17.0 only bundles CASE up to 1.4.0, hence the
        # --built-version none / --ontology-graph approach below.
        run: |
          python -m pip install --upgrade pip
          pip install case-utils==0.17.0
          pip show case-utils | head -2

      - name: Build merged ontology graph
        if: steps.graph-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import glob
          from rdflib import Graph

          patterns = [
              'case-src/ontology/**/*.ttl',
              'case-src/dependencies/UCO/ontology/**/*.ttl',
              'solve_it_*.ttl',          # includes the two SHACL shapes files
          ]
          files = sorted({f for p in patterns for f in glob.glob(p, recursive=True)})

          # Guard against the most damaging silent failure: if the UCO submodule
          # is missing, the graph is nearly empty and everything "passes".
          if len(files) < 25:
              raise SystemExit(
                  f'Only {len(files)} ontology files found, expected around 32. '
                  'Is the UCO submodule checked out?'
              )

          g = Graph()
          for f in files:
              g.parse(f, format='turtle')
          print(f'{len(files)} files, {len(g)} triples')
          g.serialize('combined_ontology.ttl', format='turtle')
          PY

      # A pass only means something if a failure were possible. The SOLVE-IT
      # shapes reach case_validate incidentally, by being caught in the
      # solve_it_*.ttl glob above, so a rename or a moved file would drop them
      # silently and every run would still report success. This step feeds
      # case_validate a technique that breaks TechniqueIOTermShape and requires
      # it to be rejected. If it is accepted, the SOLVE-IT shapes are not in
      # force and the job fails here rather than reporting a hollow pass.
      - name: Confirm the SOLVE-IT shapes are in force
        run: |
          cat > canary.ttl <<'TTL'
          @prefix owl: <http://www.w3.org/2002/07/owl#> .
          @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
          @prefix solveit-core: <https://ontology.solveit-df.org/solveit/core/> .
          @prefix ex: <http://example.org/canary/> .

          ex:techniqueDFT-0000 a owl:Class , solveit-core:Technique ;
              rdfs:subClassOf solveit-core:SolveitInvestigativeAction ;
              solveit-core:techniqueID "DFT-0000" ;
              solveit-core:techniqueName "Canary" ;
              solveit-core:hasCASEInputClass ex:undeclared-term .
          TTL
          if case_validate --built-version none --allow-info \
               --ontology-graph combined_ontology.ttl canary.ttl > canary-report.txt 2>&1; then
            echo "::error::The canary was accepted. The SOLVE-IT shapes are not being applied,"
            echo "::error::so a pass from the validation step below would prove nothing."
            head -40 canary-report.txt
            exit 1
          fi
          echo "Canary correctly rejected — the SOLVE-IT shapes are in force."
          grep -m2 "Source Shape\|Message" canary-report.txt || true

      - name: Validate the generated knowledge base
        run: |
          mkdir -p validation-reports
          status=0
          for f in docs/data/solve-it-kb.ttl docs/data/solve-it-kb.jsonld; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              status=1
              continue
            fi
            report="validation-reports/$(basename "$f").txt"
            echo "::group::$f"
            # --allow-info: the knowledge base uses stable readable IRIs rather
            # than UUID-suffixed ones, so uco-core:UcoThing-identifier-regex-shape
            # reports one sh:Info result per individual (several hundred). Without
            # this flag pySHACL treats those as non-conforming and the job can
            # never pass. Warnings and Violations still fail.
            if case_validate --built-version none --allow-info \
                 --ontology-graph combined_ontology.ttl "$f" > "$report" 2>&1; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
            head -40 "$report"
            echo "::endgroup::"
          done
          exit $status

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-validation-reports
          path: |
            validation-reports/
            canary-report.txt
          if-no-files-found: warn
